<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cinémathèque — Catalogue</title>

    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/app.css">

    <!--
      Script classique, volontairement placé ici et non chargé comme module.
      Le navigateur suspend l'analyse de la page pour l'exécuter : le thème est
      donc appliqué AVANT le premier affichage. Un module serait différé, donc
      exécuté trop tard, et la page apparaîtrait brièvement en clair.
    -->
    <script src="js/lib/theme-init.js"></script>
</head>
<body>

<header class="entete">
    <div class="entete__contenu">
        <a class="logo" href="index.html">Cinémathèque</a>

        <nav class="nav">
            <a class="nav__lien nav__lien--actif" href="index.html">Catalogue</a>
            <a class="nav__lien" href="admin.html">Administration</a>
        </nav>

        <button type="button" id="bouton-theme" class="bouton-theme"
                aria-label="Changer de thème">Thème</button>
    </div>
</header>

<main class="contenu">
    <h1 class="titre-page">Catalogue</h1>

    <!-- Remplis par JavaScript -->
    <div id="barre-outils"></div>
    <p id="message" class="message" hidden></p>
    <div id="grille"></div>
    <div id="pagination"></div>
</main>

<script type="module" src="js/main.js"></script>

</body>
</html>
